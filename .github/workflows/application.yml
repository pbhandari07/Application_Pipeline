name: React Application CI-CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AZURE_WEBAPP_NAME: pankaj-react-todo

jobs:

  # =========================
  # 1. BUILD STAGE
  # =========================
  build:
    name: React Application Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./ReactTodoUIMonolith

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ReactTodoUIMonolith/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build React Application
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: ReactTodoUIMonolith/build


  # =========================
  # 2. DEPLOY STAGE
  # =========================
  deploy:
    name: Deploy React Application
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: ./build

      # =========================
      # AZURE OIDC LOGIN
      # =========================
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # =========================
      # DEPLOY TO AZURE APP SERVICE
      # =========================
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./build
